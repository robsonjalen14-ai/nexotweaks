<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <linearGradient id="shieldMain" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6fbfb8"/>
      <stop offset="100%" stop-color="#4a9e9a"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8ed5d1"/>
      <stop offset="60%" stop-color="#78cbc6"/>
      <stop offset="100%" stop-color="#68bfb9"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a9e9a"/>
      <stop offset="100%" stop-color="#3d8e8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer shield edge -->
  <path d="M100 8 L188 40 L188 110 L100 212 L12 110 L12 40 Z" fill="url(#shieldEdge)" filter="url(#shadow)"/>
  
  <!-- Main shield face -->
  <path d="M100 16 L180 44 L180 108 L100 204 L20 108 L20 44 Z" fill="url(#shieldMain)"/>
  
  <!-- Inner face lighter for 3D depth -->
  <path d="M100 28 L168 50 L168 104 L100 190 L32 104 L32 50 Z" fill="url(#shieldFace)" opacity="0.55"/>
  
  <!-- Top highlight -->
  <path d="M100 16 L180 44 L140 50 L100 38 L60 50 Z" fill="white" opacity="0.08"/>
  
  <!-- N letter -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="90" font-weight="bold" fill="white" letter-spacing="-2">N</text>
</svg>
